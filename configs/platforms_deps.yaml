  linux_dgx_spark:
    description: "NVIDIA DGX Spark with Grace ARM64 CPU and GB10 GPU"
    
    # CLI tools - installed on local machine
    cli_tools:
      - name: docker
        version: "24.0+"
        description: "Container runtime"
        docs_url: "https://docs.docker.com/engine/install/"
        check_cmd: "docker --version"
        install_cmd: "curl -fsSL https://get.docker.com | sh && sudo usermod -aG docker $USER"
        verify_cmd: "docker --version"
        requires_sudo: true
        optional: false
        order: 20

      - name: nvidia-driver
        version: "590+"
        description: "NVIDIA GPU driver (pre-installed on DGX Spark)"
        docs_url: "https://docs.nvidia.com/dgx/"
        check_cmd: "nvidia-smi --query-gpu=driver_version --format=csv,noheader 2>/dev/null | head -1"
        install_cmd: "echo 'Driver pre-installed on DGX Spark. If missing, contact NVIDIA support.'"
        verify_cmd: "nvidia-smi"
        requires_sudo: false
        optional: false
        order: 10

      - name: nvidia-container-toolkit
        version: "1.14+"
        description: "NVIDIA Container Toolkit for GPU containers"
        docs_url: "https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html"
        check_cmd: "nvidia-ctk --version 2>/dev/null || dpkg -l nvidia-container-toolkit | grep -q ii"
        install_cmd: |
          curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | sudo gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg && \
          curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | \
            sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' | \
            sudo tee /etc/apt/sources.list.d/nvidia-container-toolkit.list && \
          sudo apt-get update && sudo apt-get install -y nvidia-container-toolkit && \
          sudo nvidia-ctk runtime configure --runtime=docker && \
          sudo systemctl restart docker
        verify_cmd: "nvidia-ctk --version"
        requires_sudo: true
        optional: false
        order: 25

      - name: kubectl
        version: "1.35+"
        description: "Kubernetes CLI (ARM64 version)"
        docs_url: "https://kubernetes.io/docs/tasks/tools/install-kubectl-linux/"
        check_cmd: "kubectl version --client --short 2>/dev/null || kubectl version --client"
        install_cmd: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/arm64/kubectl" && \
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
        verify_cmd: "kubectl version --client"
        requires_sudo: true
        optional: false
        order: 30

      - name: helm
        version: "3.20+"
        description: "Kubernetes package manager"
        docs_url: "https://helm.sh/docs/intro/install/"
        check_cmd: "helm version --short"
        install_cmd: "curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash"
        verify_cmd: "helm version --short"
        requires_sudo: true
        optional: false
        order: 40

      - name: minikube
        version: "1.35+"
        description: "Minikube for local Kubernetes (recommended for DGX Spark)"
        docs_url: "https://minikube.sigs.k8s.io/docs/"
        check_cmd: "minikube version"
        install_cmd: |
          curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-arm64 && \
          sudo install minikube-linux-arm64 /usr/local/bin/minikube && \
          rm minikube-linux-arm64
        verify_cmd: "minikube version"
        requires_sudo: true
        optional: false
        order: 50

      - name: jq
        version: "1.6+"
        description: "JSON processor"
        docs_url: "https://jqlang.github.io/jq/"
        check_cmd: "jq --version"
        install_cmd: "sudo apt-get update && sudo apt-get install -y jq"
        verify_cmd: "jq --version"
        requires_sudo: true
        optional: false
        order: 15

      - name: python
        version: "3.11+"
        description: "Python runtime"
        docs_url: "https://www.python.org"
        check_cmd: "python3 --version"
        install_cmd: "sudo apt-get update && sudo apt-get install -y python3 python3-pip python3-venv"
        verify_cmd: "python3 --version"
        requires_sudo: true
        optional: false
        order: 12
    
    # Cluster components
    cluster_components:
      - name: minikube_cluster
        version: "latest"
        description: "Local Kubernetes cluster via minikube with GPU support"
        docs_url: "https://minikube.sigs.k8s.io/docs/"
        check_cmd: "minikube status 2>/dev/null | grep -q 'host: Running'"
        install_cmd: "minikube start --driver=docker --gpus=all --memory=48g --cpus=12"
        verify_cmd: "kubectl cluster-info 2>/dev/null"
        requires_sudo: false
        optional: false
        order: 100
        requires_cluster: false
        
      - name: nvidia_device_plugin
        version: "0.17+"
        description: "NVIDIA device plugin for Kubernetes GPU support"
        docs_url: "https://github.com/NVIDIA/k8s-device-plugin"
        check_cmd: "kubectl get daemonset nvidia-device-plugin-daemonset -n kube-system 2>/dev/null | grep -q nvidia"
        install_cmd: |
          kubectl create -f https://raw.githubusercontent.com/NVIDIA/k8s-device-plugin/v0.17.0/deployments/static/nvidia-device-plugin.yml
        verify_cmd: "kubectl get pods -n kube-system -l name=nvidia-device-plugin-ds"
        requires_sudo: false
        optional: false
        order: 105
        requires_cluster: true
        
      - name: cert_manager
        version: "1.14+"
        description: "Certificate management for Kubernetes"
        docs_url: "https://cert-manager.io/docs/"
        check_cmd: "kubectl get namespace cert-manager 2>/dev/null && kubectl -n cert-manager get deployment cert-manager -o jsonpath='{.status.availableReplicas}' 2>/dev/null | grep -q '[0-9]'"
        install_cmd: |
