            --namespace cert-manager --create-namespace \
            --set crds.enabled=true \
            --wait --timeout 300s
        verify_cmd: "kubectl -n cert-manager get pods -l app=cert-manager"
        requires_sudo: false
        optional: false
        order: 110
        requires_cluster: true
        
      - name: kserve
        version: "0.13+"
        description: "KServe for ML model serving"
        docs_url: "https://kserve.github.io/website/"
        check_cmd: "kubectl get crd inferenceservices.serving.kserve.io 2>/dev/null"
