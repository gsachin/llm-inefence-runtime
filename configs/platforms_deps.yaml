        docs_url: "https://docs.docker.com/desktop/wsl/"
        check_cmd: "docker --version"
        install_cmd: |
          echo "Please install Docker Desktop on Windows and enable WSL2 integration"
        verify_cmd: "docker --version"
        requires_sudo: false
        optional: false
        order: 20

      - name: kubectl
        version: "1.29+"
        description: "Kubernetes CLI"
        docs_url: "https://kubernetes.io/docs/tasks/tools/install-kubectl-linux/"
        check_cmd: "kubectl version --client"
        install_cmd: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" && \
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
        verify_cmd: "kubectl version --client"
        requires_sudo: true
        optional: false
        order: 30

      - name: helm
        version: "3.14+"
        description: "Kubernetes package manager"
        docs_url: "https://helm.sh/docs/intro/install/"
        check_cmd: "helm version --short"
        install_cmd: "curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash"
        verify_cmd: "helm version --short"
        requires_sudo: true
        optional: false
        order: 40

      - name: k3d
        version: "5.6+"
        description: "Lightweight Kubernetes in Docker"
        docs_url: "https://k3d.io"
        check_cmd: "k3d version"
        install_cmd: "curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash"
        verify_cmd: "k3d version"
        requires_sudo: true
        optional: false
        order: 50

      - name: python
        version: "3.11+"
        description: "Python runtime"
        docs_url: "https://www.python.org"
        check_cmd: "python3 --version"
        install_cmd: "sudo apt-get update && sudo apt-get install -y python3 python3-pip python3-venv"
        verify_cmd: "python3 --version"
        requires_sudo: true
        optional: false
        order: 15
    
    # Cluster components
    cluster_components:
      - name: k3d_cluster
        version: "latest"
        description: "Local Kubernetes cluster via k3d"
        docs_url: "https://k3d.io"
        check_cmd: "k3d cluster list 2>/dev/null | grep -q llm-cluster"
        install_cmd: "k3d cluster create llm-cluster --servers 1 --agents 2 --port 8080:80@loadbalancer --port 8443:443@loadbalancer"
        verify_cmd: "kubectl cluster-info 2>/dev/null"
        requires_sudo: false
        optional: false
        order: 100
        requires_cluster: false
        
      - name: cert_manager
        version: "1.14+"
        description: "Certificate management for Kubernetes"
        docs_url: "https://cert-manager.io/docs/"
        check_cmd: "kubectl get namespace cert-manager 2>/dev/null && kubectl -n cert-manager get deployment cert-manager -o jsonpath='{.status.availableReplicas}' 2>/dev/null | grep -q '[0-9]'"
        install_cmd: |
          helm repo add jetstack https://charts.jetstack.io --force-update && \
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager --create-namespace \
            --set crds.enabled=true \
            --wait --timeout 300s
        verify_cmd: "kubectl -n cert-manager get pods -l app=cert-manager"
        requires_sudo: false
        optional: false
        order: 110
        requires_cluster: true
        
      - name: kserve
        version: "0.13+"
        description: "KServe for ML model serving"
        docs_url: "https://kserve.github.io/website/"
        check_cmd: "kubectl get crd inferenceservices.serving.kserve.io 2>/dev/null"
        install_cmd: |
          kubectl apply -f https://github.com/kserve/kserve/releases/download/v0.13.0/kserve.yaml && \
          kubectl apply -f https://github.com/kserve/kserve/releases/download/v0.13.0/kserve-cluster-resources.yaml && \
          kubectl wait --for=condition=ready pod -l control-plane=kserve-controller-manager -n kserve --timeout=300s
        verify_cmd: "kubectl get crd inferenceservices.serving.kserve.io"
        requires_sudo: false
        optional: false
        order: 120
        requires_cluster: true
