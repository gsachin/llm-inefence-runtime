# =============================================================================
# KServe Stack Dependencies
# =============================================================================
# Defines the full dependency tree for installing KServe.
# Each layer depends on the previous layers.
# =============================================================================

kserve_dependencies:

  # ---------------------------------------------------------------------------
  # Layer 1: Core Kubernetes
  # ---------------------------------------------------------------------------
  kubernetes:
    platforms: ["all"]
    engines: ["k3d", "kind", "k3s", "orbstack", "eks", "aks", "gke"]
    verify_cmd: "kubectl cluster-info"
    required: true

  # ---------------------------------------------------------------------------
  # Layer 2: Certificate Management
  # ---------------------------------------------------------------------------
  cert_manager:
    depends_on: ["kubernetes"]
    version: "v1.14.2"
    install_method: "helm"
    helm_repo: "https://charts.jetstack.io"
    helm_chart: "jetstack/cert-manager"
    namespace: "cert-manager"
    install_commands:
      - "helm repo add jetstack https://charts.jetstack.io"
      - "helm repo update"
      - "helm install cert-manager jetstack/cert-manager --namespace cert-manager --create-namespace --set installCRDs=true"
    verify_cmd: "kubectl get pods -n cert-manager -l app=cert-manager"
    retry_safe: true  # Helm upgrade handles idempotency
    required: true

  # ---------------------------------------------------------------------------
  # Layer 3: Networking / Gateway API
  # ---------------------------------------------------------------------------
  gateway_api_crds:
    depends_on: ["kubernetes"]
    version: "v1.0.0"
    install_method: "kubectl"
    install_commands:
      - "kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.0.0/standard-install.yaml"
    verify_cmd: "kubectl get crd gateways.gateway.networking.k8s.io"
    required: true

  istio:
    depends_on: ["gateway_api_crds"]
    version: "1.20.2"
    optional: true  # Can use Envoy Gateway instead
    install_method: "istioctl"
    install_commands:
      - "curl -L https://istio.io/downloadIstio | ISTIO_VERSION=1.20.2 sh -"
      - "istioctl install --set profile=minimal -y"
    verify_cmd: "kubectl get pods -n istio-system"

  envoy_gateway:
    depends_on: ["gateway_api_crds"]
    version: "v0.6.0"
    optional: true  # Alternative to Istio
    install_method: "helm"
    install_commands:
      - "helm install envoy-gateway oci://docker.io/envoyproxy/gateway-helm --version v0.6.0 -n envoy-gateway-system --create-namespace"
    verify_cmd: "kubectl get pods -n envoy-gateway-system"

  # ---------------------------------------------------------------------------
  # Layer 4: KServe
  # ---------------------------------------------------------------------------
  kserve:
    depends_on: ["cert_manager", "gateway_api_crds"]
    version: "v0.12.1"
    install_method: "kubectl"
    install_commands:
      - "kubectl apply -f https://github.com/kserve/kserve/releases/download/v0.12.1/kserve.yaml"
      - "kubectl apply -f https://github.com/kserve/kserve/releases/download/v0.12.1/kserve-runtimes.yaml"
    verify_cmd: "kubectl get crd inferenceservices.serving.kserve.io"
    post_install:
      - action: "patch_configmap"
        target: "inferenceservice-config"
        namespace: "kserve"
        patch: |
          data:
            deploy:
              defaultDeploymentMode: "RawDeployment"
    required: true

# Installation sequence (order matters)
installation_order:
  - kubernetes
  - cert_manager
  - gateway_api_crds
  - istio  # or envoy_gateway
  - kserve
